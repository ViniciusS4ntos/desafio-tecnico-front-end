<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sessão</h2>
    <p class="subtitle">Bem-vindo de volta! Insere os teus dados.</p>

    <!-- Mensagem de erro da API -->
    <div class="alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Campo E-mail -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="exemplo@dominio.com"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">O e-mail é obrigatório.</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Insere um e-mail válido.</small>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="senha">Palavra-passe</label>
        <input 
          id="senha" 
          type="password" 
          formControlName="senha" 
          placeholder="Mínimo de 6 caracteres"
          [class.is-invalid]="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched"
        />
        <div class="error-message" *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
          <small *ngIf="loginForm.get('senha')?.errors?.['required']">A palavra-passe é obrigatória.</small>
          <small *ngIf="loginForm.get('senha')?.errors?.['minlength']">Deve ter pelo menos 6 caracteres.</small>
        </div>
      </div>

      
      <button type="submit" [disabled]="isLoading" class="btn-submit">
        {{ isLoading ? 'A entrar...' : 'Entrar' }}
      </button>

    </form>

    <div class="register-redirect">
      <p>Ainda não tens conta? <a routerLink="/register">Regista-te aqui</a></p>
    </div>
  </div>
</div>
